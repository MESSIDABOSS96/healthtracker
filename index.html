<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <!-- The light header surface: what the script below sets for a visitor with
         no stored preference, and what CSS falls back to if that script can't
         run (`:root` is light, `.dark` is the override). A dark value here left
         the two disagreeing on exactly the path where nothing can correct it. -->
    <meta name="theme-color" content="#EAF1F9" />
    <!-- iOS home-screen install support (vite-plugin-pwa does NOT inject these — iOS Safari reads them from HTML, not the manifest).
         Phase 4 D-14 / RESEARCH Pitfall 2: the apple-prefixed tag is "deprecated" but still required by iOS Safari; we ship both
         the apple-prefixed and the standardized `mobile-web-app-capable` name for cross-platform correctness. -->
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <!-- NOT black-translucent. That style is supposed to hand the web app the
         whole screen and let it draw under the status bar; what iOS actually
         does is size the web view to (screen − status bar) and then place it at
         y=0 anyway. The app ends up shifted up under the clock with a dead strip
         of exactly one status bar left over at the bottom — measured at ~58pt,
         below the tab bar, showing the page canvas past the end of its own
         background. Nothing in CSS can reach it: the viewport genuinely stops
         there, which is why three rounds of shell-height fixes changed nothing.
         `default` lays the web view out below the status bar and down to the
         bottom of the screen, which is the whole ask. -->
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="VZN" />
    <!-- Both declared: browsers auto-probe /favicon.ico, but naming it lets the
         32px and 48px frames inside be picked for tabs and bookmarks instead of
         downscaling the 192 every time. -->
    <link rel="icon" href="/favicon.ico" sizes="any" />
    <link rel="icon" type="image/png" sizes="192x192" href="/icon-192.png" />
    <title>VZN</title>
    <!-- Pre-paint theme application — prevents a flash of the wrong theme.
         Mirrors src/lib/theme.ts; keep the storage key and class in sync. -->
    <script>
      (function () {
        try {
          // Light unless the user has chosen otherwise — see lib/theme.ts. The
          // fallback here is the one that decides what a NEW visitor sees, so
          // it has to match getThemePref()'s, not merely be a sane value.
          var pref = localStorage.getItem('healthtracker:theme') || 'light';
          var dark =
            pref === 'dark' ||
            (pref === 'system' &&
              window.matchMedia('(prefers-color-scheme: dark)').matches);
          document.documentElement.classList.toggle('dark', dark);
          // Installed-to-Home-Screen detection, pre-paint so the shell is never
          // laid out at the wrong height first. Both signals on purpose: iOS has
          // been unreliable about matching the standardised media feature inside
          // home-screen web apps, and `navigator.standalone` is the iOS-native
          // one that has always worked there. Either is enough.
          var standalone =
            window.matchMedia('(display-mode: standalone)').matches ||
            window.navigator.standalone === true;
          document.documentElement.classList.toggle('standalone', standalone);
          var meta = document.querySelector('meta[name="theme-color"]');
          if (meta) meta.setAttribute('content', dark ? '#16212C' : '#EAF1F9');
        } catch (e) {
          /* localStorage unavailable — fall through to CSS defaults */
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
